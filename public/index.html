<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <!-- iOS Safari Web App / Home Screen Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GENeral Chat" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <title>GENeral Chat — Web &amp; iOS PWA</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #141414;
      --card: #181818;
      --border: #282828;
      --accent: #F5C400;
      --accent-ink: #0A0A0A;
      --cyan: #00E5FF;
      --danger: #FF4444;
      --text: #FFFFFF;
      --muted: #B3B3B3;
      --focus-ring: #00E5FF;
    }

    [data-theme="paper"] {
      --bg: #F2EFE9;
      --surface: #E8E4DC;
      --card: #FFFFFF;
      --border: #CCCCCC;
      --accent: #1A1A18;
      --accent-ink: #F2EFE9;
      --cyan: #005F73;
      --danger: #B00020;
      --text: #1A1A18;
      --muted: #5A5A55;
      --focus-ring: #1A1A18;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 900;
      margin: 0;
    }

    .brand-accent {
      color: var(--accent);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-touch {
      min-width: 48px;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn-panic {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #FFFFFF;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Navigation Rail on Tablet / Desktop (>= 600px) */
    .nav-rail {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 220px;
      padding: 16px 12px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
    }

    .nav-btn {
      min-width: 48px;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .nav-btn[aria-selected="true"] {
      background-color: rgba(245, 196, 0, 0.14);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
    }

    .main-content {
      flex: 1;
      padding: 16px;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    /* Bottom Navigation Bar on Mobile (< 600px) */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    .bottom-nav .nav-btn {
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px;
      font-size: 0.72rem;
      text-align: center;
    }

    @media (min-width: 600px) {
      .nav-rail {
        display: flex;
      }
      .bottom-nav {
        display: none;
      }
      .main-content {
        padding: 24px;
        padding-bottom: 24px;
      }
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .card h2, .card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
    }

    .msg-bubble {
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .msg-ai {
      align-self: flex-start;
      background-color: var(--surface);
      border: 1px solid var(--border);
    }

    .msg-user {
      align-self: flex-end;
      background-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .composer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .composer input {
      flex: 1;
      min-width: 180px;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .composer input.is-recording {
      border-color: #FFD600;
      box-shadow: 0 0 0 3px rgba(217, 4, 41, 0.55);
    }

    .btn-mic {
      background-color: var(--surface);
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    .btn-mic.is-recording {
      background-color: #C8001E;
      border-color: #FFD600;
      color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(255, 214, 0, 0.45);
      animation: micPulse 1.1s infinite ease-in-out;
    }

    .recording-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background-color: #B00018;
      border: 3px solid #FFD600;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .recording-banner.active {
      display: flex;
    }

    .recording-indicator-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rec-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #FFD600;
      border: 2px solid #FFFFFF;
      flex-shrink: 0;
      animation: micPulse 0.9s infinite ease-in-out;
    }

    .btn-stop-rec {
      min-width: 48px;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 10px;
      border: 2px solid #FFD600;
      background-color: #000000;
      color: #FFD600;
      font-weight: 900;
      cursor: pointer;
    }

    .speech-status-note {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 20px;
    }

    .inline-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .inline-form input {
      flex: 1;
      min-width: 180px;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.82; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-mic.is-recording, .rec-dot {
        animation: none;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" role="banner">
      <h1 class="brand"><span class="brand-accent">GEN</span>eral Chat</h1>
      <div class="topbar-actions">
        <button id="themeToggle" class="btn-touch" type="button" aria-label="Kağıt ekran ve koyu tema arasında geçiş yap">
          📜 Tema
        </button>
        <button id="panicBtn" class="btn-touch btn-panic" type="button" aria-label="Acil Panik Maskesini aç">
          🚨 PANİK
        </button>
      </div>
    </header>

    <div class="workspace">
      <nav class="nav-rail" aria-label="Ana gezinme">
        <button class="nav-btn" data-tab="chats" role="tab" aria-selected="true">💬 Sohbetler</button>
        <button class="nav-btn" data-tab="communities" role="tab" aria-selected="false">👥 Topluluklar</button>
        <button class="nav-btn" data-tab="ai" role="tab" aria-selected="false">🤖 GEN AI</button>
        <button class="nav-btn" data-tab="compat" role="tab" aria-selected="false">📱 Cihaz &amp; Erişilebilirlik</button>
      </nav>

      <main class="main-content" id="mainPanel" role="main" aria-live="polite"></main>
    </div>

    <nav class="bottom-nav" aria-label="Alt gezinme">
      <button class="nav-btn" data-tab="chats" role="tab" aria-selected="true"><span>💬</span><span>Sohbet</span></button>
      <button class="nav-btn" data-tab="communities" role="tab" aria-selected="false"><span>👥</span><span>Topluluk</span></button>
      <button class="nav-btn" data-tab="ai" role="tab" aria-selected="false"><span>🤖</span><span>GEN AI</span></button>
      <button class="nav-btn" data-tab="compat" role="tab" aria-selected="false"><span>📱</span><span>Sistem</span></button>
    </nav>
  </div>

  <script>
    (function () {
      const mainPanel = document.getElementById('mainPanel');
      const themeToggle = document.getElementById('themeToggle');
      const panicBtn = document.getElementById('panicBtn');
      const navButtons = Array.from(document.querySelectorAll('.nav-btn'));

      const CHATS_STORAGE_KEY = 'general_chat_user_chats_v1';
      const COMMUNITIES_STORAGE_KEY = 'general_chat_user_communities_v1';

      function loadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function saveJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {}
      }

      let activeTab = 'chats';
      let isPaper = false;
      let isPanicMask = false;
      let userChats = loadJson(CHATS_STORAGE_KEY, []);
      let userCommunities = loadJson(COMMUNITIES_STORAGE_KEY, []);
      let isRecording = false;
      let activeRecognition = null;
      let speechStatusText = '';

      const aiHistory = [
        { role: 'ai', text: 'Merhaba! GENeral Chat Web & iOS Safari PWA eşlikçi arayüzüne hoş geldiniz. Yazarak veya mikrofon tuşuna basıp konuşarak mesaj gönderebilirsiniz.' }
      ];

      function stopActiveRecording() {
        if (activeRecognition && isRecording) {
          try {
            activeRecognition.stop();
          } catch (e) {}
        }
        isRecording = false;
      }

      function render() {
        navButtons.forEach((btn) => {
          btn.setAttribute('aria-selected', String(btn.dataset.tab === activeTab));
        });

        if (isPanicMask) {
          stopActiveRecording();
          mainPanel.innerHTML = `
            <section class="card" aria-label="Hesap Makinesi Maskesi">
              <h2>Hesap Makinesi</h2>
              <p class="muted">Güvenli maskeleme modu aktif. Geri dönmek için üstteki PANİK düğmesine tekrar dokunun.</p>
            </section>
          `;
          return;
        }

        if (activeTab === 'chats') {
          mainPanel.innerHTML = `
            <section aria-labelledby="chatsHeading">
              <h2 id="chatsHeading">Sohbet Listesi</h2>
              <form class="inline-form" id="addChatForm">
                <label class="sr-only" for="newChatInput">Kişi veya @kullanici_adi ekle</label>
                <input id="newChatInput" type="text" placeholder="Eklemek istediğiniz kişi adı veya @kullanici_adi..." autocomplete="off" />
                <button class="btn-touch btn-primary" type="submit">+ Sohbet Ekle</button>
              </form>
              <div class="card-grid">
                <article class="card">
                  <h3>🤖 Gemini AI Asistan</h3>
                  <p class="muted">Yapay zekâ sohbeti ve sesli dikte (Web Speech API) hazır.</p>
                  <button id="openAiTabBtn" class="btn-touch btn-primary" type="button" style="margin-top:8px;">GEN AI'ı Aç</button>
                </article>
                ${userChats.length === 0 ? `
                  <article class="card">
                    <h3>Henüz Kişisel Sohbet Yok</h3>
                    <p class="muted">Yapay sahte kişiler kaldırıldı. Yukarıdan yalnızca kendi eklediğiniz kişileri veya Android uygulamasındaki ücretsiz yerel sunucuyu kullanabilirsiniz.</p>
                  </article>
                ` : userChats.map((c, idx) => `
                  <article class="card">
                    <h3>👤 ${escapeHtml(c.name)}</h3>
                    <p class="muted">${escapeHtml(c.note || 'Kullanıcı tarafından eklendi')}</p>
                    <button class="btn-touch remove-chat-btn" data-index="${idx}" type="button" style="margin-top:8px;">Sil</button>
                  </article>
                `).join('')}
              </div>
            </section>
          `;
          document.getElementById('openAiTabBtn').addEventListener('click', () => {
            activeTab = 'ai';
            render();
          });
          document.getElementById('addChatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inp = document.getElementById('newChatInput');
            const name = inp.value.trim();
            if (!name) return;
            userChats.unshift({ name, note: 'Kullanıcı tarafından eklendi' });
            saveJson(CHATS_STORAGE_KEY, userChats);
            render();
          });
          Array.from(document.querySelectorAll('.remove-chat-btn')).forEach((btn) => {
            btn.addEventListener('click', () => {
              const i = Number(btn.dataset.index);
              userChats.splice(i, 1);
              saveJson(CHATS_STORAGE_KEY, userChats);
              render();
            });
          });
        } else if (activeTab === 'communities') {
          mainPanel.innerHTML = `
            <section aria-labelledby="commHeading">
              <h2 id="commHeading">GEN Toplulukları</h2>
              <form class="inline-form" id="addCommForm">
                <label class="sr-only" for="newCommInput">Topluluk adı</label>
                <input id="newCommInput" type="text" placeholder="Yeni topluluk adı girin..." autocomplete="off" />
                <button class="btn-touch btn-primary" type="submit">+ Topluluk Kur</button>
              </form>
              <div class="card-grid">
                ${userCommunities.length === 0 ? `
                  <article class="card">
                    <h3>Henüz Topluluk Oluşturulmadı</h3>
                    <p class="muted">Hazır sahte topluluklar silindi. Yalnızca kendi oluşturduğunuz topluluklar burada görünür.</p>
                  </article>
                ` : userCommunities.map((comm, idx) => `
                  <article class="card">
                    <h3>👥 ${escapeHtml(comm.name)}</h3>
                    <p class="muted">${escapeHtml(comm.desc || 'Kullanıcı topluluğu')}</p>
                    <button class="btn-touch remove-comm-btn" data-index="${idx}" type="button" style="margin-top:8px;">Kaldır</button>
                  </article>
                `).join('')}
              </div>
            </section>
          `;
          document.getElementById('addCommForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inp = document.getElementById('newCommInput');
            const name = inp.value.trim();
            if (!name) return;
            userCommunities.unshift({ name, desc: 'Kurucu: Siz · 1 üye' });
            saveJson(COMMUNITIES_STORAGE_KEY, userCommunities);
            render();
          });
          Array.from(document.querySelectorAll('.remove-comm-btn')).forEach((btn) => {
            btn.addEventListener('click', () => {
              const i = Number(btn.dataset.index);
              userCommunities.splice(i, 1);
              saveJson(COMMUNITIES_STORAGE_KEY, userCommunities);
              render();
            });
          });
        } else if (activeTab === 'ai') {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          mainPanel.innerHTML = `
            <section class="card chat-box" aria-labelledby="aiHeading">
              <h2 id="aiHeading">GEN AI Sohbet</h2>
              <div class="recording-banner ${isRecording ? 'active' : ''}" id="recordingBanner" role="status" aria-live="assertive">
                <div class="recording-indicator-left">
                  <span class="rec-dot" aria-hidden="true"></span>
                  <span>CANLI SES KAYDI AKTİF · KONUŞUYORSUNUZ...</span>
                </div>
                <button type="button" id="stopRecBtn" class="btn-stop-rec" aria-label="Ses kaydını durdur">Durdur</button>
              </div>
              <div class="msg-list" id="msgList" role="log" aria-label="Mesaj geçmişi">
                ${aiHistory.map(m => `<div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-ai'}">${escapeHtml(m.text)}</div>`).join('')}
              </div>
              <div class="speech-status-note" id="speechStatus" aria-live="polite">${escapeHtml(speechStatusText)}</div>
              <form class="composer" id="aiForm">
                <label class="sr-only" for="aiInput">Mesajınız</label>
                <input id="aiInput" class="${isRecording ? 'is-recording' : ''}" type="text" placeholder="Mesajınızı yazın veya mikrofona konuşun..." autocomplete="off" />
                <button
                  id="voiceBtn"
                  class="btn-touch btn-mic ${isRecording ? 'is-recording' : ''}"
                  type="button"
                  aria-label="${isRecording ? 'Sesli dikteyi durdur' : 'Sesle mesaj dikte et'}"
                  aria-pressed="${isRecording ? 'true' : 'false'}"
                >
                  ${isRecording ? '⏹️ Kaydı Bitir' : '🎙️ Konuş'}
                </button>
                <button class="btn-touch btn-primary" type="submit" aria-label="Mesajı gönder">Gönder</button>
              </form>
            </section>
          `;

          const aiForm = document.getElementById('aiForm');
          const aiInput = document.getElementById('aiInput');
          const voiceBtn = document.getElementById('voiceBtn');
          const stopRecBtn = document.getElementById('stopRecBtn');
          const recordingBanner = document.getElementById('recordingBanner');
          const speechStatus = document.getElementById('speechStatus');

          function updateRecordingVisuals(active, note) {
            isRecording = active;
            if (typeof note === 'string') {
              speechStatusText = note;
              speechStatus.textContent = note;
            }
            recordingBanner.classList.toggle('active', active);
            voiceBtn.classList.toggle('is-recording', active);
            voiceBtn.setAttribute('aria-pressed', String(active));
            voiceBtn.setAttribute('aria-label', active ? 'Sesli dikteyi durdur' : 'Sesle mesaj dikte et');
            voiceBtn.textContent = active ? '⏹️ Kaydı Bitir' : '🎙️ Konuş';
            aiInput.classList.toggle('is-recording', active);
          }

          voiceBtn.addEventListener('click', () => {
            if (!SpeechRec) {
              updateRecordingVisuals(false, 'Bu tarayıcı Web Speech API ses tanımayı desteklemiyor (Chrome, Edge veya iOS Safari önerilir).');
              return;
            }
            if (isRecording && activeRecognition) {
              activeRecognition.stop();
              return;
            }

            const baseValue = aiInput.value.trim();
            const recognition = new SpeechRec();
            activeRecognition = recognition;
            recognition.lang = 'tr-TR';
            recognition.interimResults = true;
            recognition.continuous = false;

            recognition.onstart = () => {
              updateRecordingVisuals(true, 'Mikrofon açık: Konuştuğunuz kelimeler yazıya dönüştürülüyor...');
            };

            recognition.onresult = (event) => {
              let transcript = '';
              for (let i = 0; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
              }
              const cleaned = transcript.trim();
              aiInput.value = baseValue ? `${baseValue} ${cleaned}` : cleaned;
            };

            recognition.onerror = (event) => {
              const reason = event.error === 'not-allowed'
                ? 'Mikrofon izni reddedildi. Tarayıcı izinlerinden mikrofonu etkinleştirin.'
                : event.error === 'no-speech'
                  ? 'Ses algılanamadı. Tekrar konuşmayı deneyin.'
                  : `Ses tanıma hatası: ${event.error}`;
              updateRecordingVisuals(false, reason);
            };

            recognition.onend = () => {
              updateRecordingVisuals(false, aiInput.value.trim() ? 'Ses metne aktarıldı. Düzenleyip Gönder tuşuna basabilirsiniz.' : speechStatusText);
            };

            try {
              recognition.start();
            } catch (err) {
              updateRecordingVisuals(false, 'Ses kaydı başlatılamadı.');
            }
          });

          stopRecBtn.addEventListener('click', () => {
            if (activeRecognition && isRecording) {
              activeRecognition.stop();
            }
          });

          aiForm.addEventListener('submit', function (e) {
            e.preventDefault();
            stopActiveRecording();
            const val = aiInput.value.trim();
            if (!val) return;
            speechStatusText = '';
            aiHistory.push({ role: 'user', text: val });
            aiHistory.push({ role: 'ai', text: 'Web PWA önizlemesi aktif. Tam Firebase AI Logic modeli ve ücretsiz yerel sunucu Android uygulamasında çalışmaktadır.' });
            render();
          });
        } else {
          mainPanel.innerHTML = `
            <section class="card" aria-labelledby="compatHeading">
              <h2 id="compatHeading">Çapraz Platform ve Erişilebilirlik</h2>
              <p class="muted">
                <strong>Tarayıcı:</strong> ${escapeHtml(navigator.userAgent)}<br/>
                <strong>Ekran:</strong> ${window.innerWidth}px × ${window.innerHeight}px<br/>
                <strong>Web Speech API:</strong> ${(window.SpeechRecognition || window.webkitSpeechRecognition) ? 'Destekleniyor ✓' : 'Bu tarayıcıda desteklenmiyor'}<br/>
                <strong>Standartlar:</strong> Minimum 48px dokunma alanları, yüksek kontrast kayıt göstergesi, klavye odak halkası, WCAG kontrast, iOS safe-area-inset desteği.
              </p>
            </section>
          `;
        }
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      navButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          stopActiveRecording();
          isPanicMask = false;
          activeTab = btn.dataset.tab;
          render();
        });
      });

      themeToggle.addEventListener('click', () => {
        isPaper = !isPaper;
        document.documentElement.setAttribute('data-theme', isPaper ? 'paper' : 'cyber');
      });

      panicBtn.addEventListener('click', () => {
        isPanicMask = !isPanicMask;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
