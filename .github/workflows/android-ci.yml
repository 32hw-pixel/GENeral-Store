name: Android CI (Debug Build & Robolectric Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run Unit & Robolectric Tests
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests "com.example.ExampleUnitTest"
          --tests "com.example.ExampleRobolectricTest"
          --tests "com.example.data.AiResponseAndErrorHandlingTest"
          --tests "com.example.util.GenAiAndSecurityFeatureTest"
          --tests "com.example.ui.screens.MainMenuButtonBehaviorTest"
          --no-daemon
